{%- comment -%}
Usage in any Markdown file:
  {% include figure.html src="/assets/images/file.jpg" alt="What it shows" caption="Optional caption" %}
{%- endcomment -%}
<figure>
  <img src="{{ include.src | relative_url }}" alt="{{ include.alt | escape }}" loading="lazy">
  {%- if include.caption %}
  <figcaption>{{ include.caption }}</figcaption>
  {%- endif %}
</figure>
